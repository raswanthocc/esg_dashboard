# Render blueprint: a single web service that serves both the API and the
# built React SPA, plus a managed Postgres. The build script handles the
# frontend build + collectstatic so Whitenoise picks up the assets.
#
# Deploy: connect this repo in Render, click "Apply Blueprint". On first
# deploy run `python manage.py seed` from the Render shell to populate the
# demo tenant, lookups, and factors. (We intentionally don't auto-seed in
# the build step so re-deploys don't re-mutate prod data.)

databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe_esg

services:
  - type: web
    name: breathe-esg
    runtime: python
    plan: free
    rootDir: .
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn breathe_esg.wsgi --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: NODE_VERSION
        value: "20.11.0"
